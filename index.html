<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA — Future in our hands!</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#718096;--line:#e5eaf2;--blue:#4967f5;--pale:#eef1ff;--green:#16865b;--shadow:0 12px 35px #1b2b5010}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{height:auto;min-height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px max(18px,calc((100% - 1180px)/2));position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:850;letter-spacing:-1px;color:var(--blue);cursor:pointer}.brand span{color:var(--ink)}.tag{font-size:10px;color:var(--muted);letter-spacing:1.4px;margin-left:8px}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button,.ghost{background:transparent;color:#526078;padding:10px 13px;border-radius:10px}.nav button.active,.nav button:hover,.ghost:hover{background:var(--pale);color:var(--blue)}.primary,.secondary,.danger{padding:10px 15px;border-radius:10px;font-weight:650}.primary{background:var(--blue);color:#fff;box-shadow:0 5px 12px #4967f52b}.primary:hover{background:#3554e7}.secondary{background:var(--pale);color:var(--blue)}.danger{background:#fff0f0;color:#c33}.wrap{max-width:1180px;margin:auto;padding:32px 22px 70px}.hero{background:linear-gradient(120deg,#17244c,#344fc1 70%,#7187ff);color:white;border-radius:24px;padding:38px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;box-shadow:var(--shadow)}.hero h1{font-size:clamp(30px,4vw,44px);line-height:1.12;margin:0 0 12px;letter-spacing:-1.5px}.hero p{color:#dce3ff;max-width:580px;margin:0 0 23px}.hero .primary{background:white;color:#334fc4}.orb{width:160px;height:160px;flex:none;border:1px solid #ffffff55;border-radius:50%;display:grid;place-items:center;font-size:65px;box-shadow:0 0 0 25px #ffffff0c,0 0 0 50px #ffffff08;margin:0 35px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:30px 0 16px}.section-head h2{margin:0;font-size:23px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:16px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.subject{cursor:pointer;transition:.18s}.subject:hover{transform:translateY(-3px);border-color:#b8c4ff}.emoji{font-size:28px;margin-bottom:12px}.subject h3,.course-card h3{margin:0 0 5px}.subject p,.course-card p{margin:0;color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.pill{font-size:12px;padding:5px 9px;background:#f0f2f7;border-radius:30px;color:#667085}.course-card button{margin-top:14px}.crumb{color:var(--muted);font-size:13px;margin-bottom:18px}.crumb button{padding:0;background:none;color:var(--blue)}.empty{padding:34px;text-align:center;color:var(--muted);grid-column:1/-1}.lesson-layout{display:grid;grid-template-columns:250px 1fr;gap:18px}.module-list button{display:block;text-align:left;width:100%;padding:11px;border-radius:10px;background:transparent;color:#526078;margin-top:5px}.module-list button.active,.module-list button:hover{background:var(--pale);color:var(--blue)}.lesson-content h1{margin:10px 0}.material{white-space:pre-wrap;line-height:1.8;color:#39465c;margin:15px 0}.video-placeholder{background:#111a32;color:white;border-radius:14px;min-height:160px;display:grid;place-items:center;margin:17px 0}.task{border:1px solid var(--line);border-radius:14px;padding:17px;margin-top:14px}.task h3{margin:9px 0}.task textarea,.field,select{width:100%;border:1px solid #dce2ed;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.task textarea{min-height:95px;resize:vertical}.field:focus,select:focus,textarea:focus{border-color:#8295ff;box-shadow:0 0 0 3px #4967f51a}.feedback{margin-top:10px;padding:10px;border-radius:9px;font-size:13px}.ok{background:#e9f8f0;color:#13734c}.bad{background:#fff2e9;color:#a64c17}.builder{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.field-group{margin:13px 0}.field-group label{display:block;font-weight:650;font-size:13px;margin-bottom:6px}.type-help,.file-note{font-size:12px;color:var(--muted);margin-top:5px}.task-preview{background:#f8f9fc;border:1px dashed #cbd3e3;border-radius:13px;padding:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:12px 18px;border-radius:12px;display:none;z-index:10;box-shadow:var(--shadow)}footer{text-align:center;color:#98a2b3;padding:28px;font-size:12px}.hide{display:none!important}@media(max-width:760px){.top{position:static;align-items:flex-start;flex-direction:column}.tag{display:none}.wrap{padding:22px 14px 50px}.hero{padding:27px}.orb{display:none}.lesson-layout,.builder{grid-template-columns:1fr}.module-list{display:flex;overflow:auto;gap:5px}.module-list button{min-width:145px}.section-head{align-items:flex-start;flex-wrap:wrap}}

.certificate{background:#fff;border:10px double #4967f5;border-radius:18px;padding:34px;text-align:center;max-width:850px;margin:20px auto;box-shadow:var(--shadow);position:relative}
.certificate:before{content:"NEXORA";display:block;font-size:13px;letter-spacing:5px;color:var(--blue);font-weight:850}
.certificate h1{font-family:Georgia,serif;font-size:clamp(28px,5vw,48px);color:#263b91;margin:12px 0}
.certificate .cert-name{font:italic 30px Georgia,serif;border-bottom:1px solid #aab5d1;display:inline-block;padding:8px 25px;margin:12px}
.certificate .cert-course{font-size:22px;font-weight:750;margin:12px}
.certificate .cert-meta{display:flex;justify-content:space-between;gap:15px;margin-top:35px;color:#526078;font-size:13px}
.price-tag{font-weight:750;color:#16865b}.locked{opacity:.78}.pay-note{font-size:12px;color:var(--muted);margin-top:8px}
@media print{body{background:#fff}.top,footer,.toast,.no-print{display:none!important}.wrap{max-width:none;padding:0}.certificate{box-shadow:none;margin:0 auto;min-height:90vh;display:flex;flex-direction:column;justify-content:center;break-inside:avoid}}
</style></head>
<body>
<header class="top"><div class="row"><div class="brand" data-action="home">NEXORA<span>.</span></div><span class="tag">FUTURE IN OUR HANDS</span></div><nav class="nav"><button id="navHome" class="active" data-action="home">Обучение</button><button id="navMy" data-action="my">Мои курсы</button><button id="navCreate" data-action="creator">Создать курс</button></nav></header>
<main class="wrap" id="app"></main><footer>NEXORA · Future in our hands!</footer><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const KEY='nexora_practice_demo_v2';
const subjects=[['📐','Математика','Логика, алгебра и геометрия'],['⚛️','Физика','Законы природы и эксперименты'],['🧪','Химия','Вещества и реакции'],['🌍','География','Планета и её процессы'],['📚','Русский язык','Грамотность и литература'],['🇬🇧','Английский язык','Язык и общение'],['🏛️','История','События и цивилизации'],['💻','Информатика','Алгоритмы и программирование'],['🧬','Биология','Жизнь и живые системы'],['🎨','Искусство','Творчество и культура']];
let db=loadDB(),page='home',selectedCourse=null,selectedLesson=0;
function emptyDB(){return{courses:[],done:{},scores:{}}}
function loadDB(){try{let x=JSON.parse(localStorage.getItem(KEY));if(!x)x=JSON.parse(localStorage.getItem('nexora_practice_demo_v1'));return x&&Array.isArray(x.courses)?x:emptyDB()}catch(e){return emptyDB()}}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Не удалось сохранить данные браузера');return false}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2400)}
function nav(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id===id))}
function goHome(){page='home';nav('navHome');renderHome()}
function renderHome(){document.getElementById('app').innerHTML=`<section class="hero"><div><h1>Учись создавать<br>своё будущее.</h1><p>NEXORA — пространство для знаний, практики и собственных образовательных проектов.</p><button class="primary" data-action="scrollSubjects">Выбрать предмет →</button></div><div class="orb">✦</div></section><div class="section-head" id="subjects"><h2>Школьные предметы</h2><span class="muted">Выбери направление</span></div><div class="grid">${subjects.map((s,i)=>`<article class="card subject" data-action="subject" data-index="${i}"><div class="emoji">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p></article>`).join('')}</div><div class="section-head"><h2>Курсы сообщества</h2><span class="muted">${db.courses.length} создано</span></div><div class="grid">${db.courses.length?db.courses.map(courseCard).join(''):'<div class="card empty">Пока нет пользовательских курсов. Создай первый курс!</div>'}</div>`}
function courseCard(c){return `<article class="card course-card"><div class="row between"><span class="pill">${esc(c.subject||'Авторский курс')}</span><span class="muted">${c.lessons.length} урок.</span></div><h3>${esc(c.title)}</h3><p>${esc(c.description||'Описание курса пока не добавлено.')}</p><div class="row between" style="margin-top:10px"><span class="price-tag">${Number(c.price||0)>0?esc(c.price)+' ֏':'Бесплатно'}</span>${Number(c.price||0)>0&&!isPaid(c.id)?'<span class="pill">Платный доступ</span>':(Number(c.price||0)>0?'<span class="pill">Оплачен</span>':'')}</div><button class="secondary" data-action="openCourse" data-id="${esc(c.id)}">Открыть курс →</button></article>`}
function showSubject(i){const s=subjects[i];page='subject';nav('');document.getElementById('app').innerHTML=`<div class="crumb"><button data-action="home">Обучение</button> / ${s[1]}</div><div class="section-head"><div><h2>${s[0]} ${s[1]}</h2><p class="muted">Курсы по школьному предмету</p></div><button class="primary" data-action="creator" data-subject="${esc(s[1])}">Создать курс</button></div><div class="grid">${db.courses.filter(c=>c.subject===s[1]).map(courseCard).join('')||'<div class="card empty">В этом предмете пока нет курсов. Ты можешь создать первый!</div>'}</div>`}
function showMyCourses(){page='my';nav('navMy');document.getElementById('app').innerHTML=`<div class="section-head"><div><h2>Мои курсы</h2><p class="muted">Курсы, созданные в этом браузере</p></div><button class="primary" data-action="creator">＋ Новый курс</button></div><div class="grid">${db.courses.map(courseCard).join('')||'<div class="card empty">Ты ещё не создал курсы.</div>'}</div>`}
function showCreator(subject=''){page='creator';nav('navCreate');document.getElementById('app').innerHTML=`<div class="crumb"><button data-action="home">Обучение</button> / Создание курса</div><div class="section-head"><div><h2>Конструктор курсов</h2><p class="muted">Создай курс, добавь уроки и практические задания.</p></div></div><div class="panel"><div class="builder"><div><div class="field-group"><label for="cTitle">Название курса</label><input class="field" id="cTitle" placeholder="Например, Физика: от механики до космоса"></div><div class="field-group"><label for="cSubject">Школьный предмет</label><select id="cSubject">${subjects.map(s=>`<option ${s[1]===subject?'selected':''}>${s[1]}</option>`).join('')}<option>Межпредметный курс</option></select></div><div class="field-group"><label for="cDesc">Описание курса</label><textarea class="field" id="cDesc" rows="4" placeholder="Чему научится ученик?"></textarea></div><div class="field-group"><label for="cPrice">Цена курса (֏)</label><input class="field" id="cPrice" type="number" min="0" max="10000000" value="0"><div class="type-help">0 ֏ — бесплатный курс. В этой версии оплата демонстрационная, реальные деньги не списываются.</div></div><button class="primary" data-action="createCourse">Создать курс и перейти к урокам</button></div><aside class="task-preview"><b>Как будет выглядеть курс</b><p class="muted">Ученик увидит название, предмет, описание, список уроков и практические задания внутри уроков.</p><div class="row"><span class="pill">Уроки</span><span class="pill">Практика</span><span class="pill">Проверка</span></div><p class="type-help">Это демонстрационный прототип. Курсы хранятся только в этом браузере и не видны другим пользователям.</p></aside></div></div>`}
function createCourse(){const title=document.getElementById('cTitle').value.trim();if(!title)return toast('Введи название курса');const c={id:'c'+Date.now(),title,subject:document.getElementById('cSubject').value,description:document.getElementById('cDesc').value.trim(),price:Math.max(0,Number(document.getElementById('cPrice').value)||0),lessons:[]};db.courses.push(c);saveDB();toast('Курс создан! Теперь добавь урок.');openCourse(c.id,true)}
function getCourse(id){return db.courses.find(c=>c.id===id)}
function isPaid(id){return !!(db.payments&&db.payments[id])}
function courseComplete(c){return !!(c.lessons.length&&c.lessons.every((l,i)=>db.completedLessons&&db.completedLessons[c.id+'_'+i]))}
function lessonKey(c,i){return c.id+'_'+i}
function certificateId(c){return 'NX-'+String(c.id).replace(/[^a-z0-9]/gi,'').slice(-8).toUpperCase()+'-'+(Object.keys(db.certificates||{}).length+1).toString().padStart(4,'0')}
function markLessonDone(){const c=getCourse(selectedCourse);if(!c)return;db.completedLessons=db.completedLessons||{};db.completedLessons[lessonKey(c,selectedLesson)]=true;saveDB();toast('Урок отмечен как завершённый');renderLesson()}
function issueCertificate(){const c=getCourse(selectedCourse);if(!c||!courseComplete(c))return toast('Сначала заверши все уроки курса');db.certificates=db.certificates||{};if(!db.certificates[c.id])db.certificates[c.id]={id:certificateId(c),date:new Date().toLocaleDateString('ru-RU'),name:db.studentName||'Ученик NEXORA'};saveDB();showCertificate(c.id)}
function showCertificate(id){const c=getCourse(id),cert=db.certificates&&db.certificates[id];if(!c||!cert)return;page='certificate';nav('');document.getElementById('app').innerHTML=`<div class="row between no-print"><button class="secondary" data-action="openCourse" data-id="${esc(c.id)}">← К курсу</button><button class="primary" data-action="printCertificate">Скачать / сохранить PDF</button></div><div class="certificate"><div style="color:#718096;letter-spacing:3px;margin-top:20px">СЕРТИФИКАТ О ПРОХОЖДЕНИИ</div><h1>Сертификат</h1><p>Настоящим подтверждается, что</p><div class="cert-name">${esc(cert.name)}</div><p>успешно завершил(а) образовательный курс</p><div class="cert-course">${esc(c.title)}</div><p>${esc(c.description||'')}</p><div class="cert-meta"><span>Дата: ${esc(cert.date)}</span><span>№ ${esc(cert.id)}</span><span>NEXORA</span></div></div><p class="muted no-print" style="text-align:center">В окне печати выбери «Сохранить как PDF».</p>`}
function showPayment(id){const c=getCourse(id);if(!c)return;if(isPaid(id)){openCourse(id);return}page='payment';nav('');document.getElementById('app').innerHTML=`<div class="crumb"><button data-action="home">Обучение</button> / Оплата курса</div><div class="panel" style="max-width:600px;margin:auto"><h2>Открыть доступ к курсу</h2><h3>${esc(c.title)}</h3><p class="muted">${esc(c.description||'')}</p><div class="section-head"><h2>К оплате</h2><strong class="price-tag">${Number(c.price||0).toLocaleString('ru-RU')} ֏</strong></div><div class="field-group"><label for="payerName">Имя ученика для сертификата</label><input id="payerName" class="field" placeholder="Например, Алексей"></div><div class="pay-note">Демонстрационный режим: кнопка ниже только отмечает курс как оплаченный в этом браузере. Банковские данные не запрашиваются, деньги не списываются.</div><button class="primary" style="margin-top:18px" data-action="demoPay">Подтвердить демо-оплату</button></div>`;window.currentPaymentCourse=id}
function finishDemoPayment(){const id=window.currentPaymentCourse,c=getCourse(id);if(!c)return;db.payments=db.payments||{};db.payments[id]={date:new Date().toISOString(),demo:true};const name=document.getElementById('payerName')?.value.trim();if(name)db.studentName=name;saveDB();toast('Демо-доступ открыт');openCourse(id)}

function openCourse(id,edit=false){const c=getCourse(id);if(!c)return goHome();if(!edit&&Number(c.price||0)>0&&!isPaid(id)){showPayment(id);return}selectedCourse=id;page='course';nav('');document.getElementById('app').innerHTML=`<div class="crumb"><button data-action="home">Обучение</button> / ${esc(c.subject)} / ${esc(c.title)}</div><div class="section-head"><div><h2>${esc(c.title)}</h2><p class="muted">${esc(c.description)}</p></div><div class="row"><button class="secondary" data-action="addLesson">＋ Добавить урок</button>${courseComplete(c)?'<button class="primary" data-action="issueCertificate">Получить сертификат</button>':''}</div></div><p class="muted">${c.lessons.filter((l,i)=>db.completedLessons&&db.completedLessons[lessonKey(c,i)]).length} из ${c.lessons.length} уроков завершено</p><div class="grid">${c.lessons.map((l,i)=>`<article class="card course-card"><span class="pill">Урок ${i+1}</span><h3>${esc(l.title)}</h3><p>${l.tasks.length} практических заданий</p><button class="secondary" data-action="openLesson" data-index="${i}">${edit?'Редактировать и открыть':'Открыть урок'} →</button></article>`).join('')||'<div class="card empty">В курсе пока нет уроков. Нажми «Добавить урок», чтобы начать.</div>'}</div>`}
function addLesson(){const title=prompt('Название урока:');if(!title||!title.trim())return;const c=getCourse(selectedCourse);if(!c)return;c.lessons.push({title:title.trim(),material:'Добавь сюда объяснение темы.\n\nРасскажи ученикам главное, приведи примеры и объясни, что нужно сделать.',video:'',tasks:[]});saveDB();openCourse(selectedCourse,true);toast('Урок добавлен')}
function openLesson(i){selectedLesson=i;page='lesson';renderLesson()}
function renderLesson(){const c=getCourse(selectedCourse),l=c?.lessons[selectedLesson];if(!l)return openCourse(selectedCourse);const tasks=l.tasks.map((t,i)=>taskForStudent(t,i)).join('');document.getElementById('app').innerHTML=`<div class="crumb"><button data-action="home">Обучение</button> / <button data-action="openCourse" data-id="${esc(c.id)}">${esc(c.title)}</button> / Урок ${selectedLesson+1}</div><div class="lesson-layout"><aside class="panel module-list"><b>Содержание курса</b>${c.lessons.map((x,i)=>`<button class="${i===selectedLesson?'active':''}" data-action="openLesson" data-index="${i}">${i+1}. ${esc(x.title)}</button>`).join('')}<button data-action="addLesson">＋ Добавить урок</button></aside><section class="panel lesson-content"><div class="row between"><span class="pill">${esc(c.subject)}</span><button class="secondary" data-action="editLesson">Изменить урок</button></div><h1>${esc(l.title)}</h1><div class="material">${esc(l.material)}</div>${l.video?`<div class="video-placeholder">▶ Видео: ${esc(l.video)}</div>`:''}<div class="row no-print" style="margin:18px 0"><button class="secondary" data-action="markLessonDone">${db.completedLessons&&db.completedLessons[lessonKey(c,selectedLesson)]?'✓ Урок завершён':'Отметить урок как завершённый'}</button></div><div class="section-head"><h2>Практика</h2><span class="pill">${l.tasks.length} заданий</span></div>${tasks||'<div class="task"><p class="muted">В этом уроке пока нет практических заданий.</p></div>'}<div class="row between" style="margin-top:20px"><span class="muted">Практика помогает закрепить знания.</span><button class="primary" data-action="taskBuilder">＋ Создать задание</button></div></section></div>`}
function taskForStudent(t,i){const score=db.scores[t.id];let input=t.type==='file'?`<input type="file" id="answer-${i}" class="field"><div class="file-note">В демоверсии файл выбирается локально и не загружается на сервер.</div>`:t.type==='steps'?`<div>${t.steps.map((s,j)=>`<label class="row" style="margin:9px 0"><input type="checkbox" id="step-${i}-${j}"> ${esc(s)}</label>`).join('')}</div>`:`<textarea id="answer-${i}" placeholder="Напиши свой ответ..."></textarea>`;return `<div class="task"><div class="row between"><span class="pill">${typeName(t.type)}</span><span class="muted">${t.points} баллов</span></div><h3>${i+1}. ${esc(t.title)}</h3><div class="material">${esc(t.prompt)}</div>${input}<div class="row" style="margin-top:12px"><button class="primary" data-action="submitTask" data-id="${esc(t.id)}" data-index="${i}">Отправить ответ</button>${score!==undefined?`<span class="pill">Результат: ${score}/${t.points}</span>`:''}</div><div class="feedback" id="feedback-${i}" aria-live="polite"></div></div>`}
function typeName(t){return({text:'Письменный ответ',file:'Прикрепление файла',steps:'Практика по шагам',code:'Написать код'})[t]||'Практическое задание'}
function submitTask(id,i){const c=getCourse(selectedCourse),t=c?.lessons[selectedLesson]?.tasks.find(x=>x.id===id),f=document.getElementById('feedback-'+i);if(!t||!f)return;let score=0,msg='';if(t.type==='steps'){const count=t.steps.filter((_,j)=>document.getElementById(`step-${i}-${j}`)?.checked).length;score=count===t.steps.length?t.points:0;msg=score?'Все этапы выполнены!':'Отметь все этапы практической работы.'}else if(t.type==='file'){const file=document.getElementById('answer-'+i)?.files[0];msg=file?`Файл выбран: ${file.name}. В этой версии преподаватель не получит его автоматически.`:'Сначала выбери файл.'}else{const answer=document.getElementById('answer-'+i)?.value.trim()||'';if(!answer)return toast('Сначала введи ответ');if(t.expected){const norm=x=>x.toLowerCase().trim().replace(/\s+/g,' ');if(t.expected.split('|').map(norm).includes(norm(answer))){score=t.points;msg='Верно! Отличная работа.'}else msg='Пока неверно. Проверь решение и попробуй ещё раз.'}else msg='Ответ записан на этой странице. Для задания нужна проверка преподавателя.'}if(score>0){db.scores[id]=Math.max(db.scores[id]||0,score);db.done[id]=true;saveDB()}f.textContent=msg+(score?` Получено ${score} из ${t.points} баллов.`:'');f.className='feedback '+(score?'ok':'bad')}
function editLesson(){const c=getCourse(selectedCourse),l=c?.lessons[selectedLesson];if(!l)return;const material=prompt('Текст урока:',l.material);if(material===null)return;l.material=material;const video=prompt('Ссылка на видео (необязательно):',l.video||'');if(video!==null)l.video=video;saveDB();renderLesson();toast('Урок обновлён')}
function showTaskBuilder(){page='taskbuilder';nav('');document.getElementById('app').innerHTML=`<div class="crumb"><button data-action="backLesson">← Вернуться к уроку</button> / Новое практическое задание</div><div class="section-head"><div><h2>Создание практики</h2><p class="muted">Добавь задание, которое ученик сможет выполнить в уроке.</p></div></div><div class="panel"><div class="builder"><div><div class="field-group"><label for="tTitle">Название задания</label><input class="field" id="tTitle" placeholder="Например, Рассчитай скорость автомобиля"></div><div class="field-group"><label for="tPrompt">Условие задания</label><textarea class="field" id="tPrompt" rows="5" placeholder="Опиши, что должен сделать ученик..."></textarea></div><div class="field-group"><label for="tType">Тип практического задания</label><select id="tType"><option value="text">Письменный ответ</option><option value="code">Написать код / формулу</option><option value="steps">Практика по шагам</option><option value="file">Прикрепить файл</option></select><div class="type-help" id="typeHelp">Ученик вводит ответ текстом. Можно настроить автоматическую проверку.</div></div><div id="extraFields"><div class="field-group"><label for="tExpected">Правильный ответ для автопроверки</label><input class="field" id="tExpected" placeholder="Например: 25"><div class="type-help">Несколько вариантов можно разделить символом |. Оставь поле пустым для ручной проверки.</div></div></div><div class="field-group"><label for="tPoints">Баллы за задание</label><input class="field" id="tPoints" type="number" min="1" max="100" value="10"></div><button class="primary" data-action="saveTask">Добавить задание в урок</button></div><aside class="task-preview"><b>Какие задания можно создавать?</b><p>✍️ <b>Письменный ответ</b><br><span class="muted">Объяснить явление, решить задачу, ответить на вопрос.</span></p><p>💻 <b>Код или формула</b><br><span class="muted">Написать программу, алгоритм или математическое выражение.</span></p><p>🧩 <b>Практика по шагам</b><br><span class="muted">Выполнить последовательность действий и отметить каждый этап.</span></p><p>📎 <b>Файл</b><br><span class="muted">Выбрать проект, фотографию решения или документ.</span></p><div class="type-help">Автопроверка сравнивает текстовый ответ с эталоном. Файлы и задания без эталона требуют проверки преподавателя.</div></aside></div></div>`;changeTaskType()}
function changeTaskType(){const type=document.getElementById('tType').value,extra=document.getElementById('extraFields'),help=document.getElementById('typeHelp');if(type==='steps'){extra.innerHTML=`<div class="field-group"><label for="tSteps">Шаги (каждый с новой строки)</label><textarea class="field" id="tSteps" rows="5" placeholder="Подготовить материалы\nВыполнить измерение\nЗаписать результат"></textarea></div>`;help.textContent='Ученик отмечает выполненные этапы практической работы.'}else if(type==='file'){extra.innerHTML='<div class="type-help">Файл сможет проверить преподаватель после подключения сервера.</div>';help.textContent='Ученик выбирает файл на своём устройстве.'}else{extra.innerHTML=`<div class="field-group"><label for="tExpected">Правильный ответ для автопроверки</label><input class="field" id="tExpected" placeholder="Например: 25"><div class="type-help">Можно указать несколько вариантов через символ |. Оставь пустым для ручной проверки.</div></div>`;help.textContent=type==='code'?'Ученик вводит код, формулу или алгоритм.':'Ученик вводит ответ текстом.'}}
function saveTask(){const title=document.getElementById('tTitle').value.trim(),promptText=document.getElementById('tPrompt').value.trim(),type=document.getElementById('tType').value,points=Math.max(1,Math.min(100,Number(document.getElementById('tPoints').value)||10));if(!title||!promptText)return toast('Заполни название и условие задания');const task={id:'t'+Date.now(),title,prompt:promptText,type,points,expected:document.getElementById('tExpected')?.value.trim()||'',steps:[]};if(type==='steps'){task.steps=document.getElementById('tSteps').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!task.steps.length)return toast('Добавь хотя бы один шаг')}getCourse(selectedCourse).lessons[selectedLesson].tasks.push(task);saveDB();toast('Практическое задание добавлено!');openLesson(selectedLesson)}
// Единый обработчик: работает и для кнопок, которые появляются после перерисовки страницы.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;switch(a){case'home':goHome();break;case'my':showMyCourses();break;case'creator':showCreator(el.dataset.subject||'');break;case'scrollSubjects':document.getElementById('subjects')?.scrollIntoView({behavior:'smooth'});break;case'subject':showSubject(Number(el.dataset.index));break;case'openCourse':openCourse(el.dataset.id);break;case'createCourse':createCourse();break;case'addLesson':addLesson();break;case'openLesson':openLesson(Number(el.dataset.index));break;case'editLesson':editLesson();break;case'taskBuilder':showTaskBuilder();break;case'backLesson':openLesson(selectedLesson);break;case'saveTask':saveTask();break;case'submitTask':submitTask(el.dataset.id,Number(el.dataset.index));break;case'markLessonDone':markLessonDone();break;case'issueCertificate':issueCertificate();break;case'printCertificate':window.print();break;case'demoPay':finishDemoPayment();break;}});
document.addEventListener('change',e=>{if(e.target.id==='tType')changeTaskType()});
renderHome();
</script></body></html>
