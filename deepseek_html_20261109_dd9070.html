<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naxoora — онлайн-школа</title>
<style>
:root{
  --primary:#e4572e; --primary-2:#f28c5a; --primary-soft:#fdeee7;
  --ink:#1a1a24; --ink2:#3a3a48; --muted:#6f6f7d;
  --bg:#faf9f7; --card:#fff; --line:#ece8e2; --line2:#e2dcd3;
  --teal:#0d9488; --star:#f59e0b; --ok:#16a34a; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{max-width:100%;display:block}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* ===== Header ===== */
header{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:18px;height:64px;max-width:1200px;margin:0 auto;padding:0 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.3px;flex-shrink:0}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:grid;place-items:center;color:#fff;font-size:18px;font-weight:800}
.search{flex:1;max-width:440px;position:relative}
.search input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px;font-family:inherit;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--primary);background:#fff}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{padding:8px 14px;border-radius:9px;font-size:14px;color:var(--ink2);font-weight:500}
.nav button:hover{background:var(--bg)}
.nav button.on{color:var(--primary);background:var(--primary-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:#c94a2c;transform:translateY(-1px);box-shadow:0 6px 18px rgba(228,87,46,.35)}
.btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--ink)}
.btn.ghost:hover{background:var(--bg)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.soft:hover{background:#fce0d5}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;cursor:pointer}

/* ===== Catalog ===== */
.hero{padding:48px 0 28px;text-align:center;background:linear-gradient(180deg,#fff5ef,transparent)}
.hero h1{font-size:clamp(28px,4.5vw,46px);font-weight:800;letter-spacing:-1px;line-height:1.12}
.hero h1 span{color:var(--primary)}
.hero p{color:var(--muted);max-width:560px;margin:14px auto 0;font-size:16px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 20px;align-items:center}
.pill{padding:7px 14px;border-radius:99px;background:#fff;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--ink2)}
.pill:hover{border-color:var(--primary)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters select{margin-left:auto;padding:8px 12px;border-radius:9px;border:1px solid var(--line2);background:#fff;font-size:13px;font-family:inherit;color:var(--ink2);cursor:pointer}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding-bottom:40px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.ccard:hover{transform:translateY(-4px);border-color:var(--primary-2);box-shadow:0 12px 30px rgba(228,87,46,.12)}
.ccover{height:150px;display:grid;place-items:center;font-size:54px;position:relative}
.ccat{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2)}
.cbody{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column;gap:8px}
.cbody h3{font-size:17px;font-weight:700;line-height:1.3}
.cauthor{font-size:13px;color:var(--muted)}
.cmeta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:8px}
.star{color:var(--star);font-weight:700;color:var(--ink)}
.cmeta .dot{width:3px;height:3px;border-radius:50%;background:var(--line2)}
.pbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .4s}

/* ===== Course page ===== */
.cbanner{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:36px 0}
.cbanner .wrap{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.cbanner .emoji{width:110px;height:110px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:52px;flex-shrink:0;backdrop-filter:blur(8px)}
.cbanner h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;line-height:1.15;margin-bottom:8px}
.cbanner .sub{opacity:.9;font-size:15px;max-width:620px}
.cbanner .meta{display:flex;gap:18px;margin-top:14px;font-size:13px;flex-wrap:wrap;opacity:.95}
.cbanner .meta b{font-weight:700}

.clayout{display:grid;grid-template-columns:1fr 340px;gap:28px;padding:28px 0 48px;align-items:start}
@media(max-width:900px){.clayout{grid-template-columns:1fr}}
.cmain h2{font-size:22px;font-weight:800;margin:24px 0 14px}
.cmain h2:first-child{margin-top:0}
.cmain p{color:var(--ink2);margin-bottom:10px}
.cmain ul{margin:0 0 12px 20px;color:var(--ink2)}
.cmain li{margin-bottom:6px}

.side{position:sticky;top:84px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.side .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.side .row b{color:var(--ink)}
.side .big{font-size:28px;font-weight:800}
.side .btn{width:100%}

.syllabus{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.module{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.module-h{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;font-size:15px;background:#fff}
.module-h:hover{background:var(--bg)}
.module-h .num{color:var(--primary);margin-right:8px}
.module-h .cnt{font-size:12px;color:var(--muted);font-weight:600}
.module-body{border-top:1px solid var(--line);display:none}
.module.open .module-body{display:block}
.lesson-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.lesson-row:last-child{border-bottom:none}
.lesson-row:hover{background:var(--primary-soft)}
.lesson-row .ico{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:12px;flex-shrink:0;color:var(--muted)}
.lesson-row.done .ico{background:var(--ok);border-color:var(--ok);color:#fff}
.lesson-row .lt{flex:1}
.lesson-row .steps{font-size:12px;color:var(--muted)}

/* ===== Lesson player ===== */
.player{min-height:calc(100vh - 64px);display:grid;grid-template-columns:290px 1fr}
@media(max-width:900px){.player{grid-template-columns:1fr}}
.pside{background:#fff;border-right:1px solid var(--line);padding:16px;overflow-y:auto;max-height:calc(100vh - 64px)}
.pside h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px;padding:0 6px}
.pmod{margin-bottom:12px}
.pmod .mh{font-size:13px;font-weight:700;padding:8px 6px;color:var(--ink2)}
.plsn{display:flex;gap:9px;align-items:center;padding:8px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink2)}
.plsn:hover{background:var(--bg)}
.plsn.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.plsn .ico{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:10px;flex-shrink:0;color:var(--muted)}
.plsn.done .ico{background:var(--ok);border-color:var(--ok);color:#fff}
.plsn.on .ico{border-color:var(--primary)}

.pmain{display:flex;flex-direction:column;min-height:calc(100vh - 64px)}
.ptop{border-bottom:1px solid var(--line);background:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px}
.ptop .back{padding:6px 10px;border-radius:8px;font-size:13px;color:var(--muted)}
.ptop .back:hover{background:var(--bg);color:var(--ink)}
.ptop .title{font-size:13px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptop .progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);min-width:180px}
.ptop .progress .pbar{flex:1;min-width:80px}

.pcontent{flex:1;padding:32px 24px;max-width:840px;width:100%;margin:0 auto}
.step-h{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--primary);font-weight:700;margin-bottom:8px}
.step-t{font-size:clamp(20px,2.6vw,28px);font-weight:800;margin-bottom:18px;line-height:1.2}

.video-box{border-radius:16px;overflow:hidden;background:#000;position:relative;aspect-ratio:16/9;margin-bottom:18px}
.video-box video{width:100%;height:100%;object-fit:cover;display:block}
.video-desc{color:var(--muted);font-size:14px}

.text-body{font-size:15px;color:var(--ink2);line-height:1.7}
.text-body p{margin-bottom:12px}
.text-body ul{margin:0 0 12px 22px}
.text-body code{background:var(--primary-soft);color:var(--primary);padding:2px 6px;border-radius:5px;font-family:'Courier New',monospace;font-size:.92em}
.text-body pre{background:var(--ink);color:#e8eaf6;padding:16px;border-radius:12px;overflow-x:auto;margin-bottom:14px;font-size:13px;line-height:1.5}

.quiz{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.quiz .q{font-size:17px;font-weight:700;margin-bottom:16px;line-height:1.4}
.opt{display:flex;gap:12px;align-items:center;padding:12px 16px;border:1.5px solid var(--line2);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;font-size:15px}
.opt:hover{border-color:var(--primary-2);background:var(--primary-soft)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.correct{border-color:var(--ok);background:#f0fdf4}
.opt.wrong{border-color:var(--danger);background:#fef2f2}
.opt .box{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;display:grid;place-items:center}
.opt.multi .box{border-radius:5px}
.opt.sel .box{border-color:var(--primary);background:var(--primary);color:#fff}
.opt.correct .box{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong .box{background:var(--danger);border-color:var(--danger);color:#fff}
.qinput{width:100%;padding:13px 16px;border:1.5px solid var(--line2);border-radius:10px;font-size:15px;font-family:inherit;margin-bottom:12px}
.qinput:focus{outline:none;border-color:var(--primary)}
.feedback{padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;margin-top:14px}
.feedback.ok{background:#f0fdf4;color:var(--ok)}
.feedback.err{background:#fef2f2;color:var(--danger)}

.pbot{border-top:1px solid var(--line);background:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pbot .steps{font-size:12px;color:var(--muted)}

/* ===== My courses / profile ===== */
.page-h{font-size:28px;font-weight:800;margin:28px 0 8px}
.page-sub{color:var(--muted);margin-bottom:24px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.stat .v{font-size:26px;font-weight:800}
.stat .l{font-size:13px;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:52px;margin-bottom:12px}

/* ===== Modals ===== */
.overlay{position:fixed;inset:0;background:rgba(20,20,30,.55);backdrop-filter:blur(4px);z-index:100;display:none;place-items:center;padding:20px}
.overlay.on{display:grid}
.modal{background:#fff;border-radius:18px;padding:28px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:21px;font-weight:800;margin-bottom:6px}
.modal p{color:var(--muted);font-size:14px;margin-bottom:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:11px 14px;border:1.5px solid var(--line2);border-radius:9px;font-size:14px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--primary)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;z-index:200;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer{background:#fff;border-top:1px solid var(--line);margin-top:40px;padding:28px 0;text-align:center;color:var(--muted);font-size:13px}
footer b{color:var(--ink)}

@media(max-width:640px){
  .nav .lbl{display:none}
  .search{max-width:none}
  .hd{gap:10px}
  .logo span{display:none}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="logo" onclick="nav('catalog')" style="cursor:pointer">
      <span class="mark">N</span><span>Naxoora</span>
    </div>
    <div class="search">
      <input id="searchInput" placeholder="Поиск курсов..." oninput="onSearch(this.value)">
    </div>
    <nav class="nav" id="navBar"></nav>
    <div id="authSlot"></div>
  </div>
</header>

<main id="app"></main>
<footer>
  <div class="wrap">© 2026 <b>Naxoora</b> — демо-версия онлайн-школы. Прогресс хранится в вашем браузере.</div>
</footer>

<div class="overlay" id="authOverlay">
  <div class="modal">
    <h3>Вход в Naxoora</h3>
    <p>Данные хранятся локально в браузере (демо).</p>
    <div class="field"><label>Имя</label><input id="aName" placeholder="Иван"></div>
    <div class="field"><label>Email</label><input id="aEmail" type="email" placeholder="ivan@mail.ru"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeAuth()">Отмена</button>
      <button class="btn primary" onclick="doLogin()">Войти</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= ДАННЫЕ ================= */
const COURSES = [
{
  id:'js', title:'JavaScript с нуля',
  sub:'От переменных до асинхронности — практика на каждом шаге',
  desc:'Курс для тех, кто хочет освоить JavaScript с нуля и дойти до уверенного уровня. Мы не просто смотрим лекции — после каждого шага ты закрепляешь материал тестами и практикой.',
  learn:['Синтаксис и типы данных','Функции, области видимости, замыкания','Работа с DOM','Асинхронность: промисы и async/await'],
  cat:'Программирование', level:'Начальный',
  rating:4.8, learners:12400, hours:6, author:'Анна Смирнова',
  emoji:'🟨', color:'linear-gradient(135deg,#fef9c3,#fde68a)',
  modules:[
    {title:'Основы языка', lessons:[
      {id:'js-1-1', title:'Введение и настройка', steps:[
        {type:'video', title:'Как устроен курс', dur:'2 мин', desc:'Коротко о том, что нас ждёт и как проходить шаги.'},
        {type:'text', title:'Что понадобится', html:'<p>Для курса нужен только браузер и желание практиковаться. Мы будем запускать код прямо в консоли браузера.</p><p>Открой DevTools клавишей <code>F12</code> и перейди во вкладку <code>Console</code>.</p>'},
        {type:'single', title:'Проверка', q:'Что такое JavaScript?', opts:['Язык разметки','Язык программирования','База данных'], a:1}
      ]},
      {id:'js-1-2', title:'Переменные и типы', steps:[
        {type:'text', title:'let, const и var', html:'<p>В современном JS используют <code>let</code> и <code>const</code>. <code>let</code> — для переменных, которые меняются, <code>const</code> — для констант.</p><pre>let age = 25;\nconst name = "Иван";</pre>'},
        {type:'multi', title:'Выбери верные', q:'Какие типы данных есть в JavaScript?', opts:['string','number','boolean','table'], a:[0,1,2]}
      ]}
    ]},
    {title:'Функции', lessons:[
      {id:'js-2-1', title:'Объявление функций', steps:[
        {type:'text', title:'Способы объявить функцию', html:'<p>Есть несколько способов: обычное объявление и стрелочная функция.</p><pre>function sum(a, b) { return a + b; }\nconst sum2 = (a, b) => a + b;</pre>'},
        {type:'input', title:'Задание', q:'Каким ключевым словом объявляют функцию в классическом варианте?', a:'function'}
      ]}
    ]}
  ]
},
{
  id:'py', title:'Python для анализа данных',
  sub:'Pandas, NumPy и первые графики — без лишней теории',
  desc:'Практический курс для тех, кто хочет научиться работать с данными на Python. Начинаем с базового синтаксиса и доходим до визуализации.',
  learn:['Синтаксис Python','Работа с NumPy и массивами','Таблицы в Pandas','Визуализация Matplotlib'],
  cat:'Программирование', level:'Средний',
  rating:4.9, learners:8200, hours:8, author:'Дмитрий Волков',
  emoji:'🐍', color:'linear-gradient(135deg,#cffafe,#a5f3fc)',
  modules:[
    {title:'Введение в Python', lessons:[
      {id:'py-1-1', title:'Python за 20 минут', steps:[
        {type:'text', title:'Базовый синтаксис', html:'<p>Python — лаконичный язык. Блоки выделяются отступами, а не скобками.</p><pre>if x > 0:\n    print("positive")\nelse:\n    print("negative")</pre>'},
        {type:'single', title:'Проверка', q:'Чем выделяются блоки кода в Python?', opts:['Фигурными скобками','Отступами','Точкой с запятой'], a:1}
      ]},
      {id:'py-1-2', title:'NumPy и массивы', steps:[
        {type:'text', title:'Массивы NumPy', html:'<p>NumPy — основа для работы с числами. Массивы позволяют делать операции над всеми элементами сразу.</p>'},
        {type:'input', title:'Задание', q:'Какая библиотека в Python используется для таблиц с данными?', a:'pandas'}
      ]}
    ]}
  ]
},
{
  id:'ui', title:'UI/UX дизайн с нуля',
  sub:'Как создавать интерфейсы, которыми приятно пользоваться',
  desc:'Курс о том, как проектировать интерфейсы: от принципов композиции до кликабельных прототипов в Figma.',
  learn:['Принципы визуальной иерархии','Работа с цветом и типографикой','Прототипирование в Figma','Проверка гипотез на пользователях'],
  cat:'Дизайн', level:'Начальный',
  rating:4.7, learners:5600, hours:5, author:'Мария Ким',
  emoji:'🎨', color:'linear-gradient(135deg,#fce7f3,#fbcfe8)',
  modules:[
    {title:'Основы дизайна', lessons:[
      {id:'ui-1-1', title:'Принципы иерархии', steps:[
        {type:'video', title:'Визуальная иерархия', dur:'6 мин', desc:'Как управлять вниманием пользователя.'},
        {type:'single', title:'Проверка', q:'Что помогает пользователю понять, что важно в первую очередь?', opts:['Визуальная иерархия','Случайный порядок','Много цветов'], a:0}

const store = {
  user(){ try{return JSON.parse(localStorage.getItem('nx_user')||'null')}catch(e){return null} },
  setUser(u){ try{localStorage.setItem('nx_user',JSON.stringify(u))}catch(e){} },
  clearUser(){ try{localStorage.removeItem('nx_user')}catch(e){} },
  progress(){ try{return JSON.parse(localStorage.getItem('nx_prog')||'{}')}catch(e){return {}} },
  setProgress(p){ try{localStorage.setItem('nx_prog',JSON.stringify(p))}catch(e){} },
  enrolled(){ try{return JSON.parse(localStorage.getItem('nx_enr')||'[]')}catch(e){return []} },
  setEnrolled(e){ try{localStorage.setItem('nx_enr',JSON.stringify(e))}catch(e){} }
};

/* ================= СОСТОЯНИЕ ================= */
const state = {
  view:'catalog',
  courseId:null,
  lessonId:null,
  step:0,

  quiz:{sel:null, selMulti:[], input:'', checked:false, ok:false, attempts:0}
};

/* ================= ХЕЛПЕРЫ ================= */
const byId = id => document.getElementById(id);
const course = id => COURSES.find(c=>c.id===id);
const lessonOf = (c, lid) => { for(const m of c.modules) for(const l of m.lessons) if(l.id===lid) return l; return null; };

function stepKey(cid, lid, idx){ return cid+'|'+lid+'|'+idx; }
function isDone(cid, lid, idx){ return (store.progress()[cid]||[]).includes(stepKey(cid,lid,idx)); }
function markDone(cid, lid, idx){
  const p = store.progress();
  p[cid] = p[cid]||[];
  const k = stepKey(cid,lid,idx);
  if(!p[cid].includes(k)) p[cid].push(k);
  store.setProgress(p);
}
function lessonDone(c, l){ return l.steps.every((_,i)=>isDone(c.id,l.id,i)); }
function courseTotalSteps(c){ return c.modules.reduce((a,m)=>a+m.lessons.reduce((b,l)=>b+l.steps.length,0),0); }
function courseDoneSteps(c){
  let n=0;
  c.modules.forEach(m=>m.lessons.forEach(l=>l.steps.forEach((_,i)=>{ if(isDone(c.id,l.id,i)) n++; })));
  return n;
}
function coursePct(c){
  const t = courseTotalSteps(c);
  return t? Math.round(courseDoneSteps(c)/t*100):0;
}
function isEnrolled(cid){ return store.enrolled().includes(cid); }
function enroll(cid){
  const e = store.enrolled();
  if(!e.includes(cid)){ e.push(cid); store.setEnrolled(e); }
}
function firstUnfinishedStep(c){
  for(const m of c.modules) for(const l of m.lessons) for(let i=0;i<l.steps.length;i++){
    if(!isDone(c.id,l.id,i)) return {lessonId:l.id, step:i};
  }
  return {lessonId:c.modules[0].lessons[0].id, step:0};
}
function lessonTotalSteps(c,l){ return l.steps.length; }
function lessonDoneSteps(c,l){ return l.steps.filter((_,i)=>isDone(c.id,l.id,i)).length; }

let toastTimer;
function toast(msg){
  const t = byId('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'),2200);
}

    if(f.q){

      if(!(c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.cat.toLowerCase().includes(q))) return false;

/* ================= ПЛЕЕР ================= */
function renderLesson(){
  const c = course(state.courseId);
  const l = lessonOf(c, state.lessonId);
  if(!c || !l){ nav('catalog'); return; }
  if(state.step >= l.steps.length) state.step = 0;
  const step = l.steps[state.step];
  const totalC = courseTotalSteps(c);
  const doneC = courseDoneSteps(c);
  const pct = Math.round(doneC/totalC*100);

  byId('app').innerHTML = `

        ${c.modules.map((m,mi)=>`

            ${m.lessons.map(l2=>{
              const on = l2.id===l.id;
              const dn = lessonDone(c,l2);
              return `<div class="plsn ${on?'on':''} ${dn?'done':''}" onclick="startLesson('${c.id}','${l2.id}')">

          </div>
        `).join('')}

          ${stepHTML(c,l,step)}
        </div>
        <div class="pbot">
          <button class="btn ghost" onclick="prevStep()" ${state.step===0?'disabled':''}>← Назад</button>
          <div class="steps">Шаг ${state.step+1} из ${l.steps.length}</div>
          <button class="btn primary" id="nextBtn" onclick="nextStep()">${isDone(c.id,l.id,state.step)?(isLastStep(c,l)?'Завершить':'Далее →'):(step.type==='video'||step.type==='text'?'Далее →':'Проверить')}</button>
        </div>
      </div>
    </div>
  `;

function isLastStep(c,l){ 
  const isLastLesson = c.modules[c.modules.length-1].lessons.slice(-1)[0].id === l.id;
  return isLastLesson && state.step === l.steps.length-1;
}

function stepHTML(c,l,step){
  const head = `<div class="step-h">Шаг ${state.step+1} · ${typeLabel(step.type)}</div><div class="step-t">${step.title}</div>`;
  if(step.type==='video'){
    return head + `
      <div class="video-box">
        <video controls poster="" preload="metadata">
          <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
        </video>
      </div>
      <div class="video-desc">${step.desc||''} ${step.dur?'· '+step.dur:''}</div>`;
  }
  if(step.type==='text'){
    return head + `<div class="text-body">${step.html}</div>`;
  }
  if(step.type==='single'){
    return head + `
      <div class="quiz" id="quizBox">
        <div class="q">${step.q}</div>
        ${step.opts.map((o,i)=>`<div class="opt" data-i="${i}" onclick="pickSingle(${i})"><div class="box"></div><div>${o}</div></div>`).join('')}
        <div class="feedback" id="fb" style="display:none"></div>
      </div>`;
  }
  if(step.type==='multi'){
    return head + `
      <div class="quiz" id="quizBox">
        <div class="q">${step.q} <span style="font-size:13px;color:var(--muted);font-weight:500">(выбери все верные)</span></div>
        ${step.opts.map((o,i)=>`<div class="opt multi" data-i="${i}" onclick="pickMulti(${i})"><div class="box"></div><div>${o}</div></div>`).join('')}
        <div class="feedback" id="fb" style="display:none"></div>
      </div>`;
  }
  if(step.type==='input'){
    return head + `
      <div class="quiz" id="quizBox">
        <div class="q">${step.q}</div>
        <input class="qinput" id="qInput" placeholder="Введи ответ..." onkeydown="if(event.key==='Enter')checkQuiz()">
        <div class="feedback" id="fb" style="display:none"></div>
      </div>`;
  }
  return head;
}
function typeLabel(t){ return {video:'Видео', text:'Теория', single:'Тест', multi:'Тест', input:'Задание'}[t]||'Шаг'; }

function resetQuiz(){
  state.quiz = {sel:null, selMulti:[], checked:false, ok:false, attempts:0};
  const c = course(state.courseId), l = lessonOf(c,state.lessonId), step = l.steps[state.step];
  if(step.type==='single' || step.type==='multi' || step.type==='input'){
    // Кнопка "Проверить" пока не пройдено
    if(!isDone(c.id,l.id,state.step)){
      const nb = byId('nextBtn');
      if(nb){ nb.textContent = 'Проверить'; }
    }
  }
}

/* --- обработка ответов --- */
function pickSingle(i){
  if(state.quiz.ok) return;
  state.quiz.sel = i;
  document.querySelectorAll('#quizBox .opt').forEach((el,idx)=>{
    el.classList.toggle('sel', idx===i);
    el.querySelector('.box').textContent = idx===i?'✓':'';
  });
}
function pickMulti(i){
  if(state.quiz.ok) return;
  const idx = state.quiz.selMulti.indexOf(i);
  if(idx>=0) state.quiz.selMulti.splice(idx,1); else state.quiz.selMulti.push(i);
  document.querySelectorAll('#quizBox .opt').forEach((el,j)=>{
    const on = state.quiz.selMulti.includes(j);
    el.classList.toggle('sel', on);
    el.querySelector('.box').textContent = on?'✓':'';
  });
}
function checkQuiz(){
  const c = course(state.courseId), l = lessonOf(c,state.lessonId), step = l.steps[state.step];
  const fb = byId('fb');
  let ok = false;

  if(step.type==='single'){
    if(state.quiz.sel===null){ toast('Выбери вариант'); return; }
    ok = state.quiz.sel === step.a;
  }
  if(step.type==='multi'){
    if(state.quiz.selMulti.length===0){ toast('Выбери варианты'); return; }
    const a = [...step.a].sort().join(','), s = [...state.quiz.selMulti].sort().join(',');
    ok = a===s;
  }
  if(step.type==='input'){
    const v = byId('qInput').value.trim().toLowerCase();
    if(!v){ toast('Введи ответ'); return; }
    ok = v === String(step.a).trim().toLowerCase();
  }

  state.quiz.attempts++;
  if(ok){
    state.quiz.ok = true; state.quiz.checked = true;
    if(step.type!=='input'){
      document.querySelectorAll('#quizBox .opt').forEach(el=>el.classList.add('correct'));
    }
    fb.className = 'feedback ok'; fb.style.display = 'block'; fb.textContent = '✓ Верно! Идём дальше.';
    markDone(c.id, l.id, state.step);
    const nb = byId('nextBtn'); nb.textContent = isLastStep(c,l)?'Завершить':'Далее →';
    refreshHeaderProgress();
  } else {
    fb.className = 'feedback err'; fb.style.display = 'block';
    if(state.quiz.attempts >= 2){
      fb.textContent = '✗ Неверно. Правильный ответ: ' + correctText(step);
      if(step.type!=='input'){
        document.querySelectorAll('#quizBox .opt').forEach((el,i)=>{
          const correct = step.type==='single'? i===step.a : step.a.includes(i);
          if(correct) el.classList.add('correct');
        });
      }
    } else {
      fb.textContent = '✗ Неверно. Попробуй ещё раз.';
    }
  }
}
function correctText(step){
  if(step.type==='single') return step.opts[step.a];
  if(step.type==='multi') return step.a.map(i=>step.opts[i]).join(', ');
  return step.a;
}

/* --- навигация по шагам --- */
function nextStep(){
  const c = course(state.courseId), l = lessonOf(c,state.lessonId), step = l.steps[state.step];
  if((step.type==='single'||step.type==='multi'||step.type==='input') && !isDone(c.id,l.id,state.step)){
    checkQuiz();
    return;
  }
  // отметить видео/текст как пройденное
  if(!isDone(c.id,l.id,state.step)) markDone(c.id, l.id, state.step);

  // следующий шаг
  if(state.step < l.steps.length-1){
    state.step++;
    renderLesson();
    return;
  }
  // урок закончен → ищем следующий
  const all = [];
  c.modules.forEach(m=>m.lessons.forEach(l2=>all.push(l2.id)));
  const idx = all.indexOf(l.id);
  if(idx < all.length-1){
    const nid = all[idx+1];
    toast('Урок пройден 🎉');
    nav('lesson',{courseId:c.id, lessonId:nid, step:0});
  } else {
    toast('🎉 Курс пройден!');
    nav('course',{courseId:c.id});
  }
}
function prevStep(){
  if(state.step>0){ state.step--; renderLesson(); return; }
  const c = course(state.courseId), l = lessonOf(c,state.lessonId);
  const all = [];
  c.modules.forEach(m=>m.lessons.forEach(l2=>all.push(l2.id)));
  const idx = all.indexOf(l.id);
  if(idx>0){
    const pid = all[idx-1];
    const pl = lessonOf(c,pid);
    nav('lesson',{courseId:c.id, lessonId:pid, step:pl.steps.length-1});
  }
}
function refreshHeaderProgress(){ renderLesson(); }

/* ================= МОИ КУРСЫ ================= */
function renderMy(){
  const u = store.user();
  const enr = store.enrolled().map(id=>course(id)).filter(Boolean);
  const totalSteps = enr.reduce((a,c)=>a+courseTotalSteps(c),0);
  const doneSteps = enr.reduce((a,c)=>a+courseDoneSteps(c),0);
  const pct = totalSteps? Math.round(doneSteps/totalSteps*100):0;

  byId('app').innerHTML = `
    <div class="wrap">
      <h1 class="page-h">Мои курсы</h1>
      <div class="page-sub">${u?u.name+', здесь твой прогресс по курсам':'Войди, чтобы сохранять прогресс'}</div>
      <div class="stats-row">
        <div class="stat"><div class="v">${enr.length}</div><div class="l">курсов начато</div></div>
        <div class="stat"><div class="v">${doneSteps}</div><div class="l">шагов пройдено</div></div>
        <div class="stat"><div class="v">${pct}%</div><div class="l">общий прогресс</div></div>
      </div>
      ${enr.length ? `<div class="cgrid">${enr.map(c=>{
        const p = coursePct(c);
        return `
        <div class="ccard" onclick="nav('course',{courseId:'${c.id}'})">
          <div class="ccover" style="background:${c.color}">${c.emoji}</div>
          <div class="cbody">
            <h3>${c.title}</h3>
            <div class="cauthor">${c.author}</div>
            <div class="pbar"><i style="width:${p}%"></i></div>
            <div class="cmeta"><span style="color:var(--primary);font-weight:700">${p}%</span><span class="dot"></span><span>продолжить →</span></div>
          </div>
        </div>`;
      }).join('')}</div>`
      : `<div class="empty"><div class="big">🌱</div><p>Ты ещё не начал ни одного курса.</p><button class="btn primary" style="margin-top:14px" onclick="nav('catalog')">В каталог</button></div>`}
    </div>
  `;
}

/* ================= ПРОФИЛЬ ================= */
function renderProfile(){
  const u = store.user();
  if(!u){ nav('catalog'); return; }
  const enr = store.enrolled();
  const totalSteps = COURSES.reduce((a,c)=>a+courseTotalSteps(c),0);
  const doneSteps = COURSES.reduce((a,c)=>a+courseDoneSteps(c),0);
  byId('app').innerHTML = `
    <div class="wrap">
      <div style="display:flex;gap:18px;align-items:center;margin:28px 0">
        <div class="avatar" style="width:72px;height:72px;font-size:28px">${u.name.charAt(0).toUpperCase()}</div>
        <div>
          <h1 style="font-size:26px;font-weight:800">${u.name}</h1>
          <div style="color:var(--muted)">${u.email}</div>
        </div>
        <button class="btn ghost" style="margin-left:auto" onclick="logout()">Выйти</button>
      </div>
      <div class="stats-row">
        <div class="stat"><div class="v">${enr.length}</div><div class="l">курсов начато</div></div>
        <div class="stat"><div class="v">${doneSteps}</div><div class="l">шагов пройдено</div></div>
        <div class="stat"><div class="v">${totalSteps?Math.round(doneSteps/totalSteps*100):0}%</div><div class="l">общий прогресс</div></div>
      </div>
      <button class="btn primary" onclick="nav('my')">Мои курсы →</button>
    </div>
  `;
}

/* ================= АВТОРИЗАЦИЯ ================= */
function openAuth(){ byId('authOverlay').classList.add('on'); }
function closeAuth(){ byId('authOverlay').classList.remove('on'); }
function doLogin(){
  const name = byId('aName').value.trim();
  const email = byId('aEmail').value.trim();
  if(!name||!email){ toast('Заполни имя и email'); return; }
  store.setUser({name,email});
  closeAuth();
  toast('Добро пожаловать, '+name+'!');
  render();
}
function logout(){ store.clearUser(); toast('Вы вышли'); nav('catalog'); }

/* ================= ГЛАВНЫЙ РЕНДЕР ================= */
function render(){
  renderHeader();
  if(state.view==='catalog') renderCatalog();
  else if(state.view==='course') renderCourse();
  else if(state.view==='lesson') renderLesson();
  else if(state.view==='my') renderMy();
  else if(state.view==='profile') renderProfile();
}

/* ================= ИНИТ ================= */
byId('authOverlay').addEventListener('click', e=>{ if(e.target.id==='authOverlay') closeAuth(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAuth(); });
render();
</script>
</body>
</html>
